# This file is an additional reference. The active ServiceMonitor is in the Helm chart.
# Keep this for interview/demo clarity.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: intelligent-platform-backend
  namespace: intelligent-platform
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: "intelligent-platform"
      app.kubernetes.io/component: backend
  namespaceSelector:
    matchNames:
      - intelligent-platform
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 5s

