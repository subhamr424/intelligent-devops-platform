{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intelligent-platform-default-deny
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "intelligent-platform"
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intelligent-platform-allow-ingress
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "intelligent-platform"
  policyTypes:
    - Ingress
  ingress:
    {{- range .Values.networkPolicy.allowFrom }}
    - from:
        {{- if .namespaceSelector }}
        - namespaceSelector:
            {{ toYaml .namespaceSelector | nindent 12 }}
        {{- end }}
        {{- if .podSelector }}
        - podSelector:
            {{ toYaml .podSelector | nindent 12 }}
        {{- end }}
    {{- end }}
{{- end }}



