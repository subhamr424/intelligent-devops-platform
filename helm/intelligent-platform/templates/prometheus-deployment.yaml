apiVersion: v1
kind: ConfigMap
metadata:
  name: intelligent-platform-prometheus-config
  namespace: {{ .Values.global.namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'intelligent-platform'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: {{ .Values.global.namespace }}
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: intelligent-platform-backend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligent-platform-prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: intelligent-platform
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intelligent-platform-prometheus
  template:
    metadata:
      labels:
        app: intelligent-platform-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: intelligent-platform-prometheus-config
        - name: prometheus-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: intelligent-platform-prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: intelligent-platform
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  selector:
    app: intelligent-platform-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
