apiVersion: v1
kind: ConfigMap
metadata:
  name: intelligent-platform-grafana-config
  namespace: {{ .Values.global.namespace }}
data:
  grafana.ini: |
    [server]
    protocol = http
    http_addr =
    http_port = 3000
    domain = intelligent-platform.local
    root_url = https://intelligent-platform.local/grafana/
    serve_from_sub_path = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligent-platform-grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: intelligent-platform
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intelligent-platform-grafana
  template:
    metadata:
      labels:
        app: intelligent-platform-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: changeme
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_SERVER_ROOT_URL
              value: https://intelligent-platform.local/grafana/
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_PATHS_PUBLIC_URL
              value: /grafana
          volumeMounts:
            - name: grafana-ini
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        - name: grafana-ini
          configMap:
            name: intelligent-platform-grafana-config
        - name: grafana-datasources
          configMap:
            name: intelligent-platform-grafana-datasources
        - name: grafana-dashboards
          configMap:
            name: intelligent-platform-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: intelligent-platform-grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: intelligent-platform
    app.kubernetes.io/component: grafana
spec:
  type: ClusterIP
  selector:
    app: intelligent-platform-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
