apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intelligent-platform
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

spec:
  rules:
  - host: intelligent-platform.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: intelligent-platform-backend
            port:
              number: 8090

      - path: /actuator
        pathType: Prefix
        backend:
          service:
            name: intelligent-platform-backend
            port:
              number: 8090

      - path: /
        pathType: Prefix
        backend:
          service:
            name: intelligent-platform-frontend
            port:
              number: 80
