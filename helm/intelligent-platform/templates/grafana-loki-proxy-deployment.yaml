apiVersion: v1
kind: Service
metadata:
  name: intelligent-platform-grafana-loki-proxy
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  selector:
    app: intelligent-platform-grafana-loki-proxy
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligent-platform-grafana-loki-proxy
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intelligent-platform-grafana-loki-proxy
  template:
    metadata:
      labels:
        app: intelligent-platform-grafana-loki-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: intelligent-platform-grafana-loki-proxy-nginx-conf
