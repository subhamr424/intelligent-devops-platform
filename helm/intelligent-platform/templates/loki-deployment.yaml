apiVersion: v1
kind: ConfigMap
metadata:
  name: intelligent-platform-loki-config
  namespace: {{ .Values.global.namespace }}
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligent-platform-loki
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: intelligent-platform
    app.kubernetes.io/component: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intelligent-platform-loki
  template:
    metadata:
      labels:
        app: intelligent-platform-loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
          args:
            - -config.file=/etc/loki/loki.yaml
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki/loki.yaml
              subPath: loki.yaml
            - name: loki-storage
              mountPath: /loki
      volumes:
        - name: loki-config
          configMap:
            name: intelligent-platform-loki-config
        - name: loki-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: intelligent-platform-loki
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: intelligent-platform
    app.kubernetes.io/component: loki
spec:
  type: ClusterIP
  selector:
    app: intelligent-platform-loki
  ports:
    - name: http
      port: 3100
      targetPort: http
