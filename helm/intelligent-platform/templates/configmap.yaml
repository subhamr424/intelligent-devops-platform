apiVersion: v1
kind: ConfigMap
metadata:
  name: intelligent-platform-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: "intelligent-platform"
    app.kubernetes.io/part-of: "intelligent-platform"
data:
  FRONTEND_API_BASE_URL: "{{ .Values.frontend.env.REACT_APP_API_BASE_URL }}"
  BACKEND_SPRING_PROFILES_ACTIVE: "{{ .Values.backend.env.SPRING_PROFILES_ACTIVE }}"
  BACKEND_MANAGEMENT_ENDPOINTS: "{{ .Values.backend.env.MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE }}"
  BACKEND_MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "{{ .Values.backend.env.MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED }}"
  GRAFANA_URL: "{{ .Values.backend.env.GRAFANA_URL }}"
  LOKI_URL: "{{ .Values.backend.env.LOKI_URL }}"









