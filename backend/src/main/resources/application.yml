server:
  port: ${SERVER_PORT:8090}

build:
  version: ${BUILD_VERSION:unknown}
  commit: ${BUILD_COMMIT:unknown}
  branch: ${BUILD_BRANCH:unknown}
  timestamp: ${BUILD_TIMESTAMP:unknown}


management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,metrics,info,prometheus}
  metrics:
    export:
      prometheus:
        enabled: ${MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED:true}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  api-docs:
    enabled: true

tracing:
  correlationHeader: ${X_CORRELATION_HEADER:X-Correlation-Id}

logging:
  level:
    root: INFO
  pattern:
    console: "%m%n"

# Grafana/Loki external URLs (used by /api/info)
# Helm injects env vars into the running container.
# Defaults are also provided via @Value in InfoApiController.

grafana:
  url: ${GRAFANA_URL:http://grafana.intelligent-platform.local}

loki:
  # Must match what Loki exposes behind Traefik. Loki has no UI at /loki.
  # Keep this as a stable operational endpoint.
  url: ${LOKI_URL:https://intelligent-platform.local/loki/ready}





